<svg xmlns="http://www.w3.org/2000/svg" width="960" height="668" viewBox="0 0 960 668" role="img"><title>Closed-cycle capital core</title><desc>As of: FY2025–26; exact cutoff not disclosed. Method: 2026-08-08. · Source: Portfolio published model / closed-cycle summary · Model / risk estimates, not audited returns. 365-day cycle projection is not achieved account return. Benchmark inputs and exact comparison dates are not disclosed.</desc><rect width="960" height="668" fill="#fff"/><g font-family="Arial, sans-serif"><text x="24" y="28" font-size="24" fill="#111315">Closed-cycle capital core</text><text x="24" y="59" font-size="14" fill="#364e60">As of: FY2025–26; exact cutoff not disclosed. Method: 2026-08-08.</text><text x="24" y="80" font-size="14" fill="#364e60">Source: Portfolio published model / closed-cycle summary</text><text x="24" y="101" font-size="14" fill="#364e60">Model / risk estimates, not audited returns. 365-day cycle</text><text x="24" y="122" font-size="14" fill="#364e60">projection is not achieved account return. Benchmark inputs and</text><text x="24" y="143" font-size="14" fill="#364e60">exact comparison dates are not disclosed.</text><text x="24" y="164" font-size="18" fill="#111315">━ Annualized cycle efficiency (%)</text><text x="24" y="189" font-size="14" fill="#182c37">Scale: 0 — 300 %</text><text x="24" y="210" font-size="15" fill="#182c37">Annualized cycle efficiency · 261.2 % · Model estimate</text><path d="M30 232H860 M30 225V239" stroke="#80909b" fill="none"/><rect x="30" y="228" width="722.6533333333333" height="8" fill="#18607b"/><text x="24" y="270" font-size="18" fill="#111315">● Weighted capital days (days)</text><text x="24" y="295" font-size="14" fill="#182c37">Scale: 0 — 8 days</text><text x="24" y="316" font-size="15" fill="#182c37">Weighted capital days · 7.8 days · Disclosed closed-cycle</text><text x="24" y="338" font-size="15" fill="#182c37">summary</text><path d="M30 360H860 M30 353V367" stroke="#80909b" fill="none"/><circle cx="839.25" cy="360" r="5" fill="#18607b"/><text x="24" y="398" font-size="18" fill="#111315">━ Closed cycles (cycles)</text><text x="24" y="423" font-size="14" fill="#182c37">Scale: 0 — 5 cycles</text><text x="24" y="444" font-size="15" fill="#182c37">Closed cycles · 5 cycles · Disclosed closed-cycle summary</text><path d="M30 466H860 M30 459V473" stroke="#80909b" fill="none"/><rect x="30" y="462" width="830" height="8" fill="#18607b"/><text x="24" y="504" font-size="18" fill="#111315">━ Annual volatility (%)</text><text x="24" y="529" font-size="14" fill="#182c37">Scale: 0 — 50 %</text><text x="24" y="550" font-size="15" fill="#182c37">Annual volatility · 45 % · Model estimate</text><path d="M30 572H860 M30 565V579" stroke="#80909b" fill="none"/><rect x="30" y="568" width="747" height="8" fill="#18607b"/><text x="24" y="610" font-size="14" fill="#364e60">No data means missing or undisclosed, never zero. Exact trade</text><text x="24" y="631" font-size="14" fill="#364e60">dates and private settlement details are not published.</text></g></svg>