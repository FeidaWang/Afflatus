<main class="recovery" aria-labelledby="errorTitle">
  <p class="code">404</p>
  <h1 id="errorTitle">Page not found. <span lang="zh">页面不存在</span></h1>
  <p>This address may be incorrect, or the page may have moved. Choose a homepage to continue.<br><span lang="zh">网址可能有误，或页面已移动。请选择首页继续浏览。</span></p>
  <nav aria-label="Recovery / 返回首页" data-i18n-static-aria>
  <a href="/en/" lang="en">English homepage</a>
  <a href="/zh/" lang="zh">返回中文首页</a>
</nav>
</main>
<script>
// Vercel serves this one file for every missing path; under /zh/ show the
// Chinese version first (header labels, links and the message).
(function () {
  if (!/^\/zh(?:\/|$)/.test(location.pathname)) return;
  var root = document.documentElement;
  root.lang = 'zh-CN';
  document.title = '404 — 页面不存在 · AFFLATUS';
  document.querySelectorAll('#afflatus-header [data-zh]').forEach(function (node) { node.textContent = node.getAttribute('data-zh'); });
  document.querySelectorAll('#afflatus-header [data-aria-zh]').forEach(function (node) { node.setAttribute('aria-label', node.getAttribute('data-aria-zh')); });
  document.querySelectorAll('#afflatus-header [data-header-path]').forEach(function (link) {
    var path = link.getAttribute('data-header-path');
    link.href = path === '/' ? '/zh/' : '/zh' + path;
  });
  var language = document.querySelector('[data-header-language]');
  language.href = '/en/'; language.hreflang = 'en'; language.textContent = 'EN';
  document.getElementById('errorTitle').innerHTML = '页面不存在。<span lang="en">Page not found.</span>';
  document.querySelector('.recovery > p:not(.code)').innerHTML = '网址可能有误，或页面已移动。请选择首页继续浏览。<br><span lang="en">This address may be incorrect, or the page may have moved. Choose a homepage to continue.</span>';
  var nav = document.querySelector('.recovery nav');
  nav.insertBefore(nav.querySelector('a[lang="zh"]'), nav.firstChild);
})();
</script>
<script type="module" src="/lib/header-controller.js"></script>
