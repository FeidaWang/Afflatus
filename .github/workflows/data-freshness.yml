name: Data pipeline health

on:
  schedule:
    # Just after Melbourne midnight in both AEDT (13:00 UTC) and AEST
    # (14:00 UTC); the off-season run regenerates the same day as a no-op.
    # 20:05 is a retry in case the midnight run failed.
    - cron: '5 13,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline-health-main
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ci_sha: ${{ steps.publish.outputs.ci_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The generator and validators only need astronomy-engine.
      - run: npm ci --omit=dev --ignore-scripts

      - name: Refresh deterministic Melbourne transits
        run: node scripts/gen-transits-daily.mjs

      - name: Validate generated data and GitHub-owned freshness
        run: |
          npm run data:check
          node scripts/check-data-freshness.mjs --strict --pipeline=horoscope-transits

      - name: Report externally orchestrated pipeline freshness
        run: node scripts/check-data-freshness.mjs

      - name: Publish a changed daily transit artifact
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/transits-daily.json; then
            echo "Transit artifact already represents the current Melbourne day."
            # Recover a dispatch interrupted after the atomic push.
            if tag=$(git describe --tags --match 'transits-ci-*' --abbrev=0 HEAD 2>/dev/null); then
              echo "ci_sha=$(git rev-parse "refs/tags/${tag}^{commit}")" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/transits-daily.json
          git commit -m "data: refresh Melbourne daily transits"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" main
          sha=$(git rev-parse HEAD)
          if [ "$sha" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Main already contains the transit update."
            exit 0
          fi
          # Use a commit-specific ref so a later main push cannot change what CI tests.
          git push --atomic "$remote" HEAD:refs/heads/main "HEAD:refs/tags/transits-ci-${sha}"
          echo "ci_sha=$sha" >> "$GITHUB_OUTPUT"

  dispatch-ci:
    needs: freshness
    if: needs.freshness.outputs.ci_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run CI on the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ needs.freshness.outputs.ci_sha }}
        run: |
          # GitHub suppresses CI push events created with GITHUB_TOKEN.
          runs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$CI_SHA" --jq '[.workflow_runs[] | select(.conclusion != "cancelled")] | length')
          if [ "$runs" -gt 0 ]; then
            echo "CI already ran or is running for $CI_SHA."
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "transits-ci-${CI_SHA}"
