name: Data pipeline health

on:
  schedule:
    # Just after Melbourne midnight in both AEDT (13:00 UTC) and AEST
    # (14:00 UTC); the off-season run regenerates the same day as a no-op.
    # 20:05 is a retry in case the midnight run failed.
    - cron: '5 13,14,20 * * *'
  workflow_dispatch:

# The token is never stored in .git/config (persist-credentials: false) and
# npm install scripts are disabled, so dependency code cannot push to main;
# only the final publish step is handed the token.
permissions:
  contents: write

concurrency:
  group: data-pipeline-health-main
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The generator and validators only need astronomy-engine.
      - run: npm ci --omit=dev --ignore-scripts

      - name: Refresh deterministic Melbourne transits
        run: node scripts/gen-transits-daily.mjs

      - name: Validate generated data and GitHub-owned freshness
        run: |
          npm run data:check
          node scripts/check-data-freshness.mjs --strict --pipeline=horoscope-transits

      - name: Report externally orchestrated pipeline freshness
        run: node scripts/check-data-freshness.mjs

      - name: Publish a changed daily transit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/transits-daily.json; then
            echo "Transit artifact already represents the current Melbourne day."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/transits-daily.json
          git commit -m "data: refresh Melbourne daily transits"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main
