name: CI

# U21 Phase 1 (rfcs/2026-07-12-u21-phase1-tech-audit.md, D2): the site had
# zero merge/push gate — 518 vitest tests only ever ran locally or inside an
# agent session, never enforced. This workflow is that gate: install, run
# the full test suite, build every page, validate the data files against
# their schemas, and fail if the main chunk grows past budget.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Data schema validation
        run: npm run data:check

      - name: Route manifest, sitemap and metadata
        run: npm run site:check

      - name: Bilingual content contract
        run: npm run lint:i18n

      - name: Build
        run: npm run build

      - name: Bundle size budget
        # D3: the main chunk (864.72 kB as of 2026-07-12) has grown for
        # months with nothing to notice. 900 kB is a deliberate small
        # headroom above today's measured size, not a target to grow into —
        # lower it as Phase 2 chunk-splitting work lands.
        run: node scripts/check-bundle-budget.mjs

  python-models:
    # api/vibe-model.py ships as a Vercel Python function; test it with the
    # same pinned requirements the deployment installs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install --require-hashes --only-binary=:all: -r requirements.txt
      - run: pip check

      - name: Model function tests
        run: python -m unittest tests/vibe_models_test.py

  browser-quality:
    name: Browser quality (${{ matrix.project }})
    needs: test-and-build
    # Visual baselines are recorded on Darwin; run them on the matching OS.
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - iphone-16-pro-max-webkit
          - galaxy-s26-ultra-chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Browser, keyboard, axe and visual gates
        # One browser worker per runner keeps heavy visual tests isolated while
        # the three device projects still execute in parallel.
        run: npm run test:e2e -- --project=${{ matrix.project }} --workers=1

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse route regression budgets
    needs: test-and-build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      # Keep performance sampling isolated from the Playwright matrix so a
      # browser failure cannot skip it or contaminate its timing profile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Lighthouse Chromium
        run: npx playwright install chromium

      - name: Enforce route regression budgets
        run: npm run lighthouse:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
